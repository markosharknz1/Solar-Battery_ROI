# Publishes every release on GitHub's own runners, straight from the tagged
# source - the ZIP people download is demonstrably built from the code in
# this repository. The ZIP is the vite-built app (dist\) plus launcher.cjs,
# the one .cmd, and the official Node.js runtime for Windows (node.exe,
# downloaded here from nodejs.org and checked against the SHASUMS256.txt
# nodejs.org publishes). Nothing in it is an executable of this project's
# own - that is the whole point (SmartScreen/Smart App Control safe).
# Release notes carry the commit, SHA-256 checksums, and (with the
# VT_API_KEY secret configured) a VirusTotal scan link.
#
# To cut a release: bump package.json, update RELEASE_NOTES.md, commit, then
#   git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # The Node.js runtime shipped in the ZIP (an LTS line; nodejs.org publishes
  # security releases on the same line - bump this when they do).
  NODE_RUNTIME_VERSION: '24.21.0'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      # Electron is a legacy devDependency; its ~100MB binary is not needed to build.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "${{ github.ref_name }}" ]; then
            echo "package.json is $pkg but the tag is ${{ github.ref_name }} - bump/commit before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: |
          npm ci
          npm run build
          node --check launcher.cjs

      - name: Fetch the official Node.js runtime for Windows
        run: |
          v="$NODE_RUNTIME_VERSION"
          curl -fsSLO "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
          curl -fsSLO "https://nodejs.org/dist/v$v/SHASUMS256.txt"
          grep " node-v$v-win-x64.zip\$" SHASUMS256.txt | sha256sum -c -
          unzip -q "node-v$v-win-x64.zip" "node-v$v-win-x64/node.exe" "node-v$v-win-x64/LICENSE"
          mkdir -p runtime
          mv "node-v$v-win-x64/node.exe" "node-v$v-win-x64/LICENSE" runtime/
          sha256sum runtime/node.exe | tee NODE_EXE_SHA256.txt

      - name: Package release ZIP
        run: |
          tag="${{ github.ref_name }}"
          app="Solar & Battery Advisor"
          mkdir -p "$app/node"
          cp -r dist "$app/dist"
          cp launcher.cjs "$app/"
          # .gitattributes pins the .cmd to CRLF, but belt-and-braces for cmd.exe:
          sed 's/\r$//; s/$/\r/' "Solar & Battery Advisor.cmd" > "$app/Solar & Battery Advisor.cmd"
          cp runtime/node.exe runtime/LICENSE "$app/node/"
          {
            echo "This is the official Node.js v$NODE_RUNTIME_VERSION runtime for Windows (node.exe) from"
            echo "https://nodejs.org/dist/v$NODE_RUNTIME_VERSION/, unchanged, and its licence. The release"
            echo "workflow downloaded it and verified it against nodejs.org's SHASUMS256.txt."
            echo "It is signed by the OpenJS Foundation: right-click node.exe > Properties >"
            echo "Digital Signatures to check."
            echo
            echo "node.exe SHA-256: $(cut -d' ' -f1 NODE_EXE_SHA256.txt)"
          } > "$app/node/README.txt"
          {
            echo "Solar & Battery Advisor ${tag#v}"
            echo "================================"
            echo
            echo "To start the app: double-click \"Solar & Battery Advisor.cmd\"."
            echo "(First time on a new PC: right-click the downloaded ZIP -> Properties ->"
            echo "tick Unblock -> OK, BEFORE extracting.)"
            echo
            echo "Your data (tariff plans, battery quotes, VPP programs, settings) is saved in"
            echo "the .edge-app-profile folder that appears next to this file, and never leaves"
            echo "this computer."
            echo
            echo "To upgrade: extract a newer ZIP over this folder (keep .edge-app-profile)."
            echo "To move the app: move this whole folder - data moves with it."
            echo "To uninstall: delete this folder. That's everything."
          } > "$app/README.txt"
          zip -qr "Solar-Battery-Advisor-$tag.zip" "$app"
          sha256sum "Solar-Battery-Advisor-$tag.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l "Solar-Battery-Advisor-$tag.zip"

      - name: VirusTotal scan
        id: vt
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          files: Solar-Battery-Advisor-${{ github.ref_name }}.zip

      - name: Write release notes
        run: |
          {
            echo "**How to install:** download the ZIP below, right-click it -> Properties -> tick **Unblock** -> OK, extract anywhere, then double-click **Solar & Battery Advisor.cmd** inside. No installer, no executable of ours, no SmartScreen warnings. Full walkthrough: [INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/INSTALL.md)."
            echo
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; fi
            echo
            echo "## Verify this download"
            echo
            echo "Built by GitHub Actions from commit [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) - see the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}). The ZIP is the tagged source built as you can read it here, plus the official Node.js v$NODE_RUNTIME_VERSION runtime for Windows in its \`node\` folder (downloaded from nodejs.org by the workflow and checked against nodejs.org's published checksums; signed by the OpenJS Foundation). Nothing in it was compiled into an executable by this project."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo "$(cut -d' ' -f1 NODE_EXE_SHA256.txt)  Solar & Battery Advisor/node/node.exe (official nodejs.org build)"
            echo '```'
            vt="${{ steps.vt.outputs.analysis }}"
            if [ -n "$vt" ]; then
              url="${vt#*=}"; url="${url%%,*}"
              echo
              echo "VirusTotal scan of the ZIP: $url"
            fi
          } > release-body.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" "Solar-Battery-Advisor-$tag.zip" SHA256SUMS.txt --title "Solar & Battery Advisor ${tag#v}" --notes-file release-body.md
